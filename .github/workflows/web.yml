name: Web checks

on:
  pull_request:
  push:
    branches: [main, "codex/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22.14.0"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Pin npm
        run: npm install --global npm@11.6.0
      - name: Install locked dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Build production artifact
        run: npm run build
      - name: Unit and component tests
        run: npm run test:unit
      - name: Install Chromium and Linux dependencies
        run: npx --no-install playwright install --with-deps chromium
      # These are Lab/HTTP-stub tests; no backend, SQL, credentials or live pilot.
      # Keep full Chromium for the headless native-zoom extension test.
      - name: Chromium frontend regression
        run: npm run test:e2e -- --project=chromium --workers=2 --forbid-only
      - name: Production artifact isolation
        run: npm run test:e2e -- --config playwright.production.config.ts --workers=1 --forbid-only
